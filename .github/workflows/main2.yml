name: Build lk2nd msm8953
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 手动触发

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y make git dtc arm-none-eabi-gcc python3

      - name: Build lk2nd-msm8953
        run: |
          make TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8953

      - name: Upload lk2nd.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-msm8953-img
          path: build-lk2nd-msm8953/lk2nd.img
          if-no-files-found: error
