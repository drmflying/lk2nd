name: Build lk2nd msm8953
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      img_path: build-lk2nd-msm8953/lk2nd.img
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y make git dtc arm-none-eabi-gcc python3

      - name: Build lk2nd-msm8953
        run: |
          make TOOLCHAIN_PREFIX=arm-none-eabi- lk2nd-msm8953

      - name: Upload lk2nd.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: lk2nd-msm8953-img
          path: build-lk2nd-msm8953/lk2nd.img
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lk2nd-msm8953-img
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: lk2nd.img
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
